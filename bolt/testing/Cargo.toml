[package]
authors       = { workspace = true }
categories    = { workspace = true }
documentation = { workspace = true }
edition       = { workspace = true }
license       = { workspace = true }
name          = "bolt-testing"
repository    = { workspace = true }
rust-version  = { workspace = true }
version       = { workspace = true }

[dependencies]
anyhow             = { workspace = true }
async-trait        = { workspace = true }
error-backtrace    = { workspace = true }
futures            = { workspace = true }
bolt-app           = { workspace = true, features = ["abci", "testing", "tracing"] }
bolt-db-memory     = { workspace = true }
bolt-math          = { workspace = true }
bolt-mock-account  = { workspace = true, features = ["library"] }
bolt-mock-bank     = { workspace = true, features = ["library"] }
bolt-mock-taxman   = { workspace = true, features = ["library"] }
bolt-types         = { workspace = true }
bolt-vm-rust       = { workspace = true }
identity           = { workspace = true }
k256               = { workspace = true }
rand               = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
tokio              = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
borsh        = { workspace = true, features = ["de_strict_order", "derive"] }
bolt-storage = { workspace = true }
prost        = { workspace = true }
reqwest      = { workspace = true, features = ["blocking", "json"] }
test-case    = { workspace = true }
thiserror    = { workspace = true }
