[package]
authors       = { workspace = true }
categories    = { workspace = true }
documentation = { workspace = true }
edition       = { workspace = true }
license       = { workspace = true }
name          = "bolt-app"
repository    = { workspace = true }
rust-version  = { workspace = true }
version       = { workspace = true }

[features]
abci    = ["data-encoding", "tendermint", "tower", "tower-abci"]
ibc     = ["ics23"]
metrics = ["dep:metrics", "bolt-types/metrics"]
testing = []
tracing = ["dep:tracing", "bolt-types/chrono"]

[dependencies]
async-trait     = { workspace = true }
borsh           = { workspace = true }
data-encoding   = { workspace = true, optional = true }
dyn-event       = { workspace = true }
error-backtrace = { workspace = true }
futures         = { workspace = true }
bolt-storage    = { workspace = true }
bolt-types      = { workspace = true }
http            = { workspace = true }
ics23           = { workspace = true, optional = true }
metrics         = { workspace = true, optional = true }
prost           = { workspace = true }
sha2            = { workspace = true }
tendermint      = { workspace = true, optional = true }
thiserror       = { workspace = true }
tokio           = { workspace = true }
tower           = { workspace = true, optional = true }
tower-abci      = { workspace = true, optional = true }
tracing         = { workspace = true, optional = true }
