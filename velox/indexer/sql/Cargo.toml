[package]
authors       = { workspace = true }
categories    = { workspace = true }
documentation = { workspace = true }
edition       = { workspace = true }
license       = { workspace = true }
name          = "velox-indexer-sql"
repository    = { workspace = true }
rust-version  = { workspace = true }
version       = { workspace = true }

[features]
async-graphql = ["dep:async-graphql", "velox-types/async-graphql", "bolt-types/async-graphql", "indexer-sql/async-graphql"]
metrics       = ["dep:metrics"]
testing       = []
tracing       = ["dep:tracing"]

[dependencies]
anyhow                      = { workspace = true }
async-graphql               = { workspace = true, optional = true }
async-trait                 = { workspace = true }
borsh                       = { workspace = true }
velox-indexer-sql-migration = { workspace = true }
velox-types                 = { workspace = true, features = ["sea-orm"] }
error-backtrace             = { workspace = true }
bolt                        = { workspace = true }
bolt-app                    = { workspace = true }
bolt-math                   = { workspace = true }
bolt-types                  = { workspace = true, features = ["chrono"] }
indexer-disk-saver          = { workspace = true }
indexer-sql                 = { workspace = true }
itertools                   = { workspace = true }
metrics                     = { workspace = true, optional = true }
sea-orm                     = { workspace = true }
serde                       = { workspace = true }
serde_json                  = { workspace = true }
strum                       = { workspace = true }
strum_macros                = { workspace = true }
tempfile                    = { workspace = true }
thiserror                   = { workspace = true }
tokio                       = { workspace = true }
tracing                     = { workspace = true, optional = true }
uuid                        = { workspace = true }

[dev-dependencies]
assertor = { workspace = true }
