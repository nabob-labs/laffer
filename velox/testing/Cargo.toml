velox-pyth-types            = { workspace = true }
velox-temp-rocksdb          = { workspace = true }
velox-types                 = { workspace = true, features = ["async-graphql"] }
velox-vm-rust               = { workspace = true }
futures                     = { workspace = true }
futures-util                = { workspace = true }
graphql_client              = { workspace = true }
hex-literal                 = { workspace = true }
k256                        = { workspace = true }
pyth-lazer-protocol         = { workspace = true }
rand                        = { workspace = true }
sea-orm                     = { workspace = true }
serde                       = { workspace = true }
serde_json                  = { workspace = true }
sha2                        = { workspace = true }
tokio                       = { workspace = true }
tracing                     = { workspace = true }
tracing-subscriber          = { workspace = true }

[dev-dependencies]
anyhow                      = { workspace = true }
assert-json-diff            = { workspace = true }
assertor                    = { workspace = true }
bip32                       = { workspace = true }
borsh                       = { workspace = true, features = ["de_strict_order", "derive"] }
chrono                      = { workspace = true }
criterion                   = { workspace = true }
velox-account-factory       = { workspace = true }
velox-auth                  = { workspace = true }
velox-backtrace             = { workspace = true }
velox-bank                  = { workspace = true }
velox-eth-utils             = { workspace = true }
velox-gateway               = { workspace = true }
velox-sdk                   = { workspace = true }
velox-storage               = { workspace = true }
velox-tester                = { workspace = true, features = ["library"] }
velox-vm-hybrid             = { workspace = true }
velox-vm-wasm               = { workspace = true }
ed25519-dalek               = { workspace = true, features = ["batch", "digest"] }
graphql_client              = { workspace = true }
hex                         = { workspace = true }
itertools                   = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
p256                        = { workspace = true }
proptest                    = { workspace = true }
