velox-crypto                = { workspace = true }
velox-db-disk               = { workspace = true }
velox-db-memory             = { workspace = true }
velox-eth-utils             = { workspace = true }
velox-genesis               = { workspace = true }
velox-hyperlane-types       = { workspace = true }
velox-identity              = { workspace = true }
velox-indexer-cache         = { workspace = true, features = ["http-request-details", "metrics", "tracing"] }
velox-indexer-clickhouse    = { workspace = true, features = ["metrics", "testing", "tracing"] }
