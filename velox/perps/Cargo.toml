[package]
authors       = { workspace = true }
categories    = { workspace = true }
documentation = { workspace = true }
edition       = { workspace = true }
license       = { workspace = true }
name          = "velox-perps"
repository    = { workspace = true }
rust-version  = { workspace = true }
version       = { workspace = true }

[features]
# If enabled, Wasm exports won't be created. This allows this contract to be
# imported into other contracts as a library.
library = []
metrics = ["dep:metrics", "bolt/metrics"]
tracing = ["dep:tracing"]

[dependencies]
anyhow                = { workspace = true }
velox-account-factory = { workspace = true, features = ["library"] }
velox-oracle          = { workspace = true, features = ["library"] }
velox-order-book      = { workspace = true }
velox-types           = { workspace = true }
bolt                  = { workspace = true }
metrics               = { workspace = true, optional = true }
tracing               = { workspace = true, optional = true }

[dev-dependencies]
test-case = { workspace = true }
