[package]
authors       = { workspace = true }
categories    = { workspace = true }
documentation = { workspace = true }
edition       = { workspace = true }
license       = { workspace = true }
name          = "velox-app"
repository    = { workspace = true }
rust-version  = { workspace = true }
version       = { workspace = true }

[features]
abci    = ["data-encoding", "tendermint", "tower", "tower-abci"]
metrics = ["velox-primitives/metrics", "dep:metrics"]
testing = []
tracing = ["velox-primitives/chrono", "dep:tracing"]

[dependencies]
async-trait      = { workspace = true }
borsh            = { workspace = true }
velox-backtrace  = { workspace = true }
velox-dyn-event  = { workspace = true }
velox-math       = { workspace = true }
velox-primitives = { workspace = true }
velox-storage    = { workspace = true }
data-encoding    = { workspace = true, optional = true }
metrics          = { workspace = true, optional = true }
prost            = { workspace = true }
sha2             = { workspace = true }
tendermint       = { workspace = true, optional = true }
thiserror        = { workspace = true }
tokio            = { workspace = true }
tower            = { workspace = true, optional = true }
tower-abci       = { workspace = true, optional = true }
tracing          = { workspace = true, optional = true }
