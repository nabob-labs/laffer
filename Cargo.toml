[workspace]
members = [
    "velox/archive/app",
    "velox/archive/block-source",
    "velox/archive/cli",
    "velox/archive/httpd",
    "velox/archive/projection",
    "velox/archive/testing",
    "velox/archive/types",
    "velox/cli",
    "velox/core/app",
    "velox/core/crypto",
    "velox/core/db/disk",
    "velox/core/db/memory",
    "velox/core/ffi",
    "velox/core/jellyfish-merkle",
    "velox/core/macros",
    "velox/core/math",
    "velox/core/storage",
    "velox/core/tester",
    "velox/core/types",
    "velox/core/vm/hybrid",
    "velox/core/vm/rust",
    "velox/core/vm/wasm",
    "velox/exchange/account",
    "velox/exchange/account-factory",
    "velox/exchange/auth",
    "velox/exchange/bank",
    "velox/exchange/gateway",
    "velox/exchange/genesis",
    "velox/exchange/oracle",
    "velox/exchange/order-book",
    "velox/exchange/perps",
    "velox/exchange/proposal-preparer",
    "velox/exchange/types",
    "velox/exchange/upgrade",
    "velox/exchange/vesting",
    "velox/exchange/warp",
    "velox/hyperlane/isms/multisig",
    "velox/hyperlane/mailbox",
    "velox/hyperlane/types",
    "velox/hyperlane/va",
    "velox/indexer/cache",
    "velox/indexer/clickhouse",
    "velox/indexer/graphql-types",
    "velox/indexer/hooked",
    "velox/indexer/httpd",
    "velox/indexer/metrics",
    "velox/indexer/sql",
    "velox/indexer/stream",
    "velox/pyth/client",
    "velox/pyth/types",
    "velox/sdk",
    "velox/sdk/cli",
    "velox/testing",
    "velox/utils/backtrace",
    "velox/utils/backtrace/derive",
    "velox/utils/config-parser",
    "velox/utils/disk-saver",
    "velox/utils/dyn-event",
    "velox/utils/eth",
    "velox/utils/identity",
    "velox/utils/temp-rocksdb",
]
resolver = "3"

[workspace.package]
authors       = ["Nabob Labs"]
categories    = ["cryptography::cryptocurrencies"]
documentation = "https://github.com/nabob-labs/laffer.git"
edition       = "2024"
homepage      = "https://github.com/nabob-labs/laffer.git"
keywords      = ["blockchain", "wasm"]
license       = "Apache-2.0 license"
repository    = "https://github.com/nabob-labs/laffer.git"
rust-version  = "1.89" # clickhouse-rs 0.14 requires rust 1.89+
version       = "0.0.0"

[workspace.dependencies]
# --------------------------- External dependencies ----------------------------
actix-codec                 = "0.5"
actix-cors                  = "0.7"
actix-files                 = "0"
actix-http                  = "3"
actix-service               = "2"
actix-test                  = "0.1"
actix-web                   = "4"
actix-web-metrics           = "0.4"
actix-ws                    = "0.4"
aes-gcm                     = "0.10"
alloy                       = "2"
anyhow                      = "1"
assert-json-diff            = "2"
assertor                    = "0.0.4"
async-graphql               = { version = "7.0", features = ["apollo_persisted_queries", "apollo_tracing", "chrono", "dataloader", "decimal", "log", "opentelemetry", "tracing", "unblock", "url", "uuid"] }
async-graphql-actix-web     = "7.0"
async-stream                = "0"
async-trait                 = "0"
awc                         = "3"
aws-config                  = "1"
aws-credential-types        = "1"
aws-sdk-s3                  = "1"
axum                        = { version = "0.8", features = ["ws"] }
bigdecimal                  = "0.4"
bip32                       = "0.5"
blake2                      = "0.10"
blake3                      = "1"
bnum                        = "0.14"
borsh                       = "1"
byteorder                   = "1"
chrono                      = "0.4"
clap                        = { version = "4", features = ["derive"] }
clickhouse                  = "0.15"
clru                        = "0.6"
colored                     = "3"
colored_json                = "5"
config                      = "0.15"
criterion                   = "0.8"
csv                         = "1.3"
data-encoding               = "2"
dialoguer                   = "0.12"
digest                      = "0.10" # FIXME: can't bump to 0.11 because RustCrypto requires 0.10
dotenvy                     = "0.15.7"
dyn-clone                   = "1"
ed25519-dalek               = "2"
elsa                        = "1"
futures                     = "0.3"
futures-util                = "0.3"
graphql_client              = "0.16"
hex                         = "0.4"
hex-literal                 = "1"
home                        = "0.5"
itertools                   = "0.14"
k256                        = "0.13"
libc                        = "0.2"
lzma-rs                     = "0.3"
metrics                     = "0.24"
metrics-exporter-prometheus = "0.18"
num_cpus                    = "1"
opentelemetry               = "0.32"
opentelemetry-otlp          = { version = "0.32", features = ["grpc-tonic", "trace"] }
opentelemetry_sdk           = { version = "0.32", features = ["rt-tokio"] }
ouroboros                   = "0.18"
p256                        = "0.13"
parking_lot                 = { version = "0.12", features = ["arc_lock", "send_guard"] }
paste                       = "1"
pbkdf2                      = "0.12"
proptest                    = "1"
prost                       = "0.14"
pyth-lazer-client           = "25.0.0"
pyth-lazer-protocol         = "0.40.0"
quote                       = "1"
rand                        = "0.8" # FIXME: can't bump to 0.10 because RustCrypto requires 0.8
rangemap                    = "1"
reqwest                     = { version = "0.13", features = ["stream"] }
ripemd                      = "0.1"
roaring                     = "0.11"
rocksdb                     = "0.24"
sea-orm                     = { version = "1", features = ["runtime-tokio-rustls", "sea-orm-internal", "sqlx-postgres", "sqlx-sqlite", "with-bigdecimal", "with-chrono", "with-json", "with-time", "with-uuid"] }
sea-orm-migration           = { version = "1", features = ["runtime-tokio-rustls", "sqlx-postgres", "sqlx-sqlite", "with-chrono", "with-json", "with-uuid"] }
sentry                      = { version = "0.48", features = ["log", "logs", "tracing"] }
sentry-actix                = "0.48"
serde                       = "1"
serde_json                  = "1"
serde_with                  = "3"
sha2                        = "0.10"
sha3                        = "0.10"
signature                   = "2"
sqlx                        = "0.8" # FIXME: can't bump to 0.9 because sea-orm 1.x requires 0.8
strum                       = "0.28"
strum_macros                = "0.28"
syn                         = "2"
tar                         = "0.4"
tempfile                    = "3"
tendermint                  = "0.40.4"
tendermint-rpc              = "0.40.4"
test-case                   = "3"
thiserror                   = "2"
tokio                       = { version = "1", features = ["full"] }
tokio-stream                = { version = "0.1", features = ["sync"] }
tokio-tungstenite           = { version = "0.29", features = ["native-tls"] }
tower                       = "0.5"
tower-abci                  = "0.19"
tracing                     = { version = "0.1" }
tracing-opentelemetry       = "0.33"
tracing-subscriber          = { version = "0.3", features = ["env-filter", "fmt", "json"] }
typenum                     = "1"
url                         = "2.5.4"
uuid                        = { version = "1", features = ["serde", "v4"] }
wasmer                      = "7"
wasmer-middlewares          = "7"
xz2                         = "0.1"
zstd                        = "0.13"
# ----------------------------- Local dependencies -----------------------------
velox-account               = { path = "velox/exchange/account" }
velox-account-factory       = { path = "velox/exchange/account-factory" }
velox-app                   = { path = "velox/core/app" }
velox-archive-app           = { path = "velox/archive/app" }
velox-archive-block-source  = { path = "velox/archive/block-source" }
velox-archive-httpd         = { path = "velox/archive/httpd" }
velox-archive-projection    = { path = "velox/archive/projection" }
velox-archive-testing       = { path = "velox/archive/testing" }
velox-archive-types         = { path = "velox/archive/types" }
velox-auth                  = { path = "velox/exchange/auth" }
velox-backtrace             = { path = "velox/utils/backtrace" }
velox-bank                  = { path = "velox/exchange/bank" }
velox-config-parser         = { path = "velox/utils/config-parser" }
velox-crypto                = { path = "velox/core/crypto" }
velox-db-disk               = { path = "velox/core/db/disk" }
velox-db-memory             = { path = "velox/core/db/memory" }
velox-disk-saver            = { path = "velox/utils/disk-saver" }
velox-dyn-event             = { path = "velox/utils/dyn-event" }
velox-eth-utils             = { path = "velox/utils/eth" }
velox-ffi                   = { path = "velox/core/ffi" }
velox-gateway               = { path = "velox/exchange/gateway" }
velox-genesis               = { path = "velox/exchange/genesis" }
velox-hyperlane-ism         = { path = "velox/hyperlane/isms/multisig" }
velox-hyperlane-mailbox     = { path = "velox/hyperlane/mailbox" }
velox-hyperlane-types       = { path = "velox/hyperlane/types" }
velox-hyperlane-va          = { path = "velox/hyperlane/va" }
velox-identity              = { path = "velox/utils/identity" }
velox-indexer-cache         = { path = "velox/indexer/cache" }
velox-indexer-clickhouse    = { path = "velox/indexer/clickhouse" }
velox-indexer-graphql-types = { path = "velox/indexer/graphql-types" }
velox-indexer-hooked        = { path = "velox/indexer/hooked" }
velox-indexer-httpd         = { path = "velox/indexer/httpd", features = ["tracing"] }
velox-indexer-metrics       = { path = "velox/indexer/metrics" }
velox-indexer-sql           = { path = "velox/indexer/sql" }
velox-indexer-stream        = { path = "velox/indexer/stream" }
velox-jmt                   = { path = "velox/core/jellyfish-merkle" }
velox-macros                = { path = "velox/core/macros" }
velox-math                  = { path = "velox/core/math" }
velox-oracle                = { path = "velox/exchange/oracle" }
velox-order-book            = { path = "velox/exchange/order-book" }
velox-perps                 = { path = "velox/exchange/perps" }
velox-primitives            = { path = "velox/core/types" }
velox-proposal-preparer     = { path = "velox/exchange/proposal-preparer" }
velox-pyth-client           = { path = "velox/pyth/client" }
velox-pyth-types            = { path = "velox/pyth/types" }
velox-sdk                   = { path = "velox/sdk" }
velox-storage               = { path = "velox/core/storage" }
velox-temp-rocksdb          = { path = "velox/utils/temp-rocksdb" }
velox-tester                = { path = "velox/core/tester" }
velox-testing               = { path = "velox/testing" }
velox-types                 = { path = "velox/exchange/types" }
velox-upgrade               = { path = "velox/exchange/upgrade" }
velox-vesting               = { path = "velox/exchange/vesting" }
velox-vm-hybrid             = { path = "velox/core/vm/hybrid" }
velox-vm-rust               = { path = "velox/core/vm/rust" }
velox-vm-wasm               = { path = "velox/core/vm/wasm" }
velox-warp                  = { path = "velox/exchange/warp" }

[profile.release]
codegen-units    = 1
debug            = false
debug-assertions = false
incremental      = false
lto              = true
opt-level        = 3
overflow-checks  = true
panic            = "abort"
rpath            = false
